name: CONSPACE Gate 1 checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# CI only. There is intentionally no production SSH/deploy job.
jobs:
  ops-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate Ops scripts and configs
        run: |
          set -euo pipefail
          for script in ops/scripts/*.sh ops/vps-audit.sh ops/check-dns.sh ops/check-public.sh; do
            bash -n "$script"
          done
          node --check ops/scripts/pm2-check.cjs
          node --check ops/ecosystem.config.cjs
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("ops/scripts/switch-nginx-gate1.py").read_text())
          PY
          git diff --check HEAD^ HEAD
      - name: Test PM2 dump safeguard (synthetic data only)
        run: |
          set -euo pipefail
          printf '[{"name":"x-hub-api"},{"name":"old-api"}]' > /tmp/pm2-fixture.json
          printf '[{"name":"x-hub-api","pm2_env":{"status":"online"}},{"name":"old-api","pm2_env":{"status":"online"}}]' |
            node ops/scripts/pm2-check.cjs /tmp/pm2-fixture.json --strict-all --require-online
          printf '>>>> PM2 daemon warning\nLocal PM2 version: 7.1.2\n[{"name":"x-hub-api","pm2_env":{"status":"online"}}]' |
            node ops/scripts/pm2-check.cjs /tmp/pm2-fixture.json
          if printf '[{"name":"old-api","pm2_env":{"status":"online"}}]' |
            node ops/scripts/pm2-check.cjs /tmp/pm2-fixture.json; then
            echo 'FAIL: missing x-hub-api was not detected'; exit 1
          fi
          if printf '[{"name":"x-hub-api","pm2_env":{"status":"stopped"}}]' |
            node ops/scripts/pm2-check.cjs /tmp/pm2-fixture.json --require-online; then
            echo 'FAIL: offline PM2 process was not detected'; exit 1
          fi
      - name: Verify backup retention and media quarantine safety
        run: |
          set -euo pipefail
          grep -q 'preserve at least 7 complete backup sets' ops/scripts/backup-all.sh
          grep -q 'orphan-quarantine' ops/scripts/media-orphan-audit.sh
          ! grep -Eq '^[[:space:]]*rm[[:space:]]+--[[:space:]]+"\\$file"' ops/scripts/media-orphan-audit.sh
      - name: Sprint 2B CMS safety harness (offline only)
        run: |
          set -euo pipefail
          node --check ops/scripts/verify-ci-checks.cjs
          node --check ops/scripts/cms-authz-acceptance.mjs
          node --check ops/scripts/local-smoke.mjs
          node --check ops/scripts/local-role-acceptance.mjs
          node --check ops/scripts/public-acceptance.mjs
          node --check ops/scripts/chromium-cdp.mjs
          node --check ops/scripts/public-browser-acceptance.mjs
          node --test ops/tests/*.test.mjs
      - name: Confirm full dependency audit remains mandatory
        run: |
          set -euo pipefail
          grep -q 'npm audit --prefix frontend --audit-level=high' .github/workflows/gate1-checks.yml
          grep -q 'npm audit --prefix backend --audit-level=high' .github/workflows/gate1-checks.yml
      - name: Reject committed runtime secrets and backups
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.(dump|pem|key|p12|pfx)$|(^|/)dump\.pm2$'; then
            echo 'FAIL: runtime secret, certificate key or database/PM2 dump is tracked'
            exit 1
          fi

  backend-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conspace
          POSTGRES_USER: conspace_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conspace_app -d conspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://conspace_app:ci-only-password@127.0.0.1:5432/conspace
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 5088
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Backend security audit
        run: npm audit --prefix backend --audit-level=high
      - name: Backend syntax and tests
        run: |
          npm run check --prefix backend
          npm test --prefix backend
      - name: PostgreSQL migration and seed verification
        run: |
          npm run db:migrate --prefix backend
          npm run db:migrate --prefix backend
          npm run db:seed --prefix backend
          npm run db:seed --prefix backend
      - name: Full local demo content seed, idempotency and coverage
        env:
          NODE_ENV: development
          DEMO_SEED_CONFIRM: LOCAL_DEMO_ONLY
          DEMO_USER_PASSWORD: ci-only-full-demo-credential-1234
        run: |
          set -euo pipefail
          npm run db:seed-demo-full --prefix backend
          npm run db:seed-demo-full --prefix backend
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { pool, closeDatabase } from './backend/src/database/pool.js';
          try {
            const count=async(sql)=>Number((await pool.query(sql)).rows[0].total);
            const niches=await count("SELECT COUNT(*)::integer AS total FROM conspace.niches WHERE is_active=true");
            const articles=await count("SELECT COUNT(*)::integer AS total FROM conspace.articles WHERE status='PUBLISHED' AND slug LIKE 'demo-full-%'");
            const chapters=await count("SELECT COUNT(*)::integer AS total FROM conspace.book_chapters WHERE article_id IS NOT NULL");
            const terms=await count("SELECT COUNT(*)::integer AS total FROM conspace.terms WHERE status='PUBLISHED' AND slug LIKE 'demo-full-%'");
            const questions=await count("SELECT COUNT(*)::integer AS total FROM conspace.reader_questions WHERE status='PUBLISHED' AND description LIKE '[DEMO] %'");
            assert.ok(niches>=8,{niches});
            assert.ok(articles>=100,{articles});
            assert.ok(chapters>=30,{chapters});
            assert.ok(terms>=8,{terms});
            assert.ok(questions>=8,{questions});
            console.log('PASS: full demo public dataset', { niches,articles,chapters,terms,questions });
          } finally { await closeDatabase(); }
          JS

      - name: Install frontend dependencies
        id: frontend_install
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Frontend production dependency audit
        run: npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Frontend full dependency audit
        run: npm audit --prefix frontend --audit-level=high
      - name: Frontend tests (when configured) and production build
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        run: |
          if node -e 'const p=JSON.parse(require("node:fs").readFileSync("frontend/package.json","utf8")); process.exit(p.scripts && p.scripts.test ? 0 : 1)'; then
            npm test --prefix frontend
          else
            echo 'SKIP: frontend/package.json has no test script; no frontend test suite is defined yet.'
          fi
          npm run build
      # Browser UI verification still runs when an upstream npm audit reports a vulnerability.
      # The mandatory security audit remains a failed gate; this never waives it.
      - name: Chromium Public Web acceptance (local synthetic fixtures)
        if: ${{ always() && steps.frontend_install.outcome == 'success' }}
        env:
          CI: 'true'
          NODE_ENV: development
          DEMO_SEED_CONFIRM: LOCAL_DEMO_ONLY
          DEMO_USER_PASSWORD: ci-only-browser-fixture-password
          DEMO_NICHE_SLUG: luxury
          CONSPACE_BROWSER_ARTIFACTS: ${{ runner.temp }}/conspace-browser-artifacts
        run: |
          set -euo pipefail
          npm run db:seed-demo --prefix backend
          (cd backend && exec node src/server.js) > "$RUNNER_TEMP/conspace-browser-api.log" 2>&1 &
          api_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js) > "$RUNNER_TEMP/conspace-browser-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5088/api/ready >/dev/null \
               && curl -fsS http://127.0.0.1:5176/ >/dev/null; then
              break
            fi
            sleep 1
          done
          command -v google-chrome || command -v chromium
          node ops/scripts/public-browser-acceptance.mjs
      - name: Upload Chromium diagnostics if acceptance fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/conspace-browser-artifacts/
            ${{ runner.temp }}/conspace-browser-api.log
            ${{ runner.temp }}/conspace-browser-web.log
